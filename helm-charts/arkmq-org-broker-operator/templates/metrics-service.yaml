apiVersion: v1
kind: Service
metadata:
  name: arkmq-org-broker-metrics-service
  labels:
    control-plane: controller-manager
  {{- include "arkmq-org-broker-operator.labels" . | nindent 4 }}
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: metrics-serving-cert
spec:
  type: {{ .Values.metricsService.type }}
  selector:
    control-plane: controller-manager
    {{- include "arkmq-org-broker-operator.selectorLabels" . | nindent 4 }}
  ports:
  {{- .Values.metricsService.ports | toYaml | nindent 2 }}
